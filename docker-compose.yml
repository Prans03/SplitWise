version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: splitwise
      POSTGRES_PASSWORD: splitwise_secret
      POSTGRES_DB: splitwise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://splitwise:splitwise_secret@db:5432/splitwise
      JWT_SECRET: change_this_in_production_please
      JWT_EXPIRES_IN: 30d
      NODE_ENV: development
    ports:
      - "4000:4000"
    volumes:
      - ./api/src:/app/src:ro

volumes:
  pgdata:
